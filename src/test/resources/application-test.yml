spring:
  datasource:
    url: jdbc:h2:mem:credit_operations_test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

jwt:
  secret: test-secret-key-must-be-at-least-256-bits-long-for-hs256-signing

resilience4j:
  retry:
    instances:
      loanManagementService:
        max-attempts: 2
        wait-duration: 10ms
        enable-exponential-backoff: false
  circuitbreaker:
    instances:
      loanManagementService:
        sliding-window-size: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 200ms
        permitted-number-of-calls-in-half-open-state: 2